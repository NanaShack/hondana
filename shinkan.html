<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新刊チェック</title>
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本棚">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="shinkan">
<header class="wrap">
  <div class="top">
    <h1><a class="back" href="./" aria-label="本棚に戻る">‹</a>新刊チェック</h1>
    <div class="top-r">
      <button class="iconbtn" id="authorsBtn">作家 <b id="followCount">0</b></button>
    </div>
  </div>
  <div class="progress" id="progress" hidden>
    <div class="ptext"><span id="ptext">確認中…</span><button class="linkbtn" id="stopBtn">止める</button></div>
    <div class="pbar"><i id="pbar"></i></div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="絞り込み"></div>
  <div class="chips kinds" id="kinds" role="group" aria-label="ジャンルで絞り込み"></div>
  <div class="tools">
    <span id="updated">まだ確認していません</span>
    <button class="linkbtn" id="refreshBtn">今すぐ更新</button>
  </div>
</header>

<main class="wrap shk-main">
  <div id="sections"></div>
  <div class="empty" id="empty" hidden></div>
  <p class="credit">新刊情報：<a href="https://ndlsearch.ndl.go.jp/" target="_blank" rel="noopener">国立国会図書館サーチ</a>（出版社が登録した発売予定の本を含みます）</p>
</main>

<div class="veil" id="veil" hidden></div>
<section class="sheet wrap" id="sheet" hidden role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" hidden></div>

<script src="kinds.js"></script>
<script src="covers.js"></script>
<script src="shinkan.js"></script>
</body>
</html>
